# OneMCP nginx reverse proxy
# HTTPS termination + oauth2-proxy IAP auth_request sidecar
# Phase 3+4: Zitadel SSO via oauth2-proxy — /mcp/ remains unprotected (Bearer token auth)

# Docker embedded DNS — defer upstream resolution to request time so nginx
# doesn't crash if backend/portal/oauth2-proxy container not yet up at nginx boot.
resolver 127.0.0.11 valid=10s ipv6=off;

# Trust Docker network for X-Forwarded-For rewriting
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate limit zones (per IP + username claim)
limit_req_zone $binary_remote_addr zone=user_ip:10m rate=100r/s;
limit_req_zone "$binary_remote_addr$http_x_onemcp_user" zone=user_id:10m rate=200r/s;

# Strip email domain: oauth2-proxy sends full email (vietnt@zimbra8815.inet.name.vn),
# backend regex accepts only local-part ([a-z0-9._-]{2,32}). Extract local-part before @.
map $auth_email $auth_username {
    ~^(?<local>[^@]+)@  $local;
    default             $auth_email;
}

# --- HTTP: ACME challenge + HTTPS redirect ---
server {
  listen 80 default_server;
  server_name _;

  # Let's Encrypt HTTP-01 challenge — served over :80 by certbot webroot
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --- HTTPS main ---
server {
  listen 443 ssl;
  http2 on;
  server_name oneconnector.000nethost.com _;

  # SSL cert — Sectigo wildcard *.000nethost.com (valid Aug 2026 → Feb 2027).
  # Files provisioned via scp; renewal manual mỗi 6 tháng.
  ssl_certificate     /etc/nginx/tls/oneconnector.fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/oneconnector.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Body size (attachments up to 100MB — enforced further at MinIO presign)
  client_max_body_size 100M;

  # Rate limits
  limit_req zone=user_ip burst=200 nodelay;
  limit_req zone=user_id burst=400 nodelay;

  # --- Alertmanager webhook IP allowlist (Phase 06, V4) ---
  # Only Alertmanager pod(s) should POST to this endpoint.
  # Replace 10.0.1.0/24 with your actual Alertmanager CIDR before enabling.
  # Uncomment the geo block in the http context and this location block to activate.
  #
  # In http context (outside server block), add:
  #   geo $alertmanager_allowed {
  #     default         0;
  #     10.0.1.10/32    1;  # alertmanager pod IP
  #     10.0.1.0/24     1;  # alertmanager pod CIDR
  #   }
  #
  # Then uncomment this location override:
  # location /api/webhooks/alertmanager {
  #   if ($alertmanager_allowed = 0) {
  #     return 403 "IP not allowed";
  #   }
  #   set $backend_upstream backend;
  #   proxy_pass         http://$backend_upstream:3000;
  #   proxy_http_version 1.1;
  #   proxy_set_header   Host              $host;
  #   proxy_set_header   X-Real-IP         $remote_addr;
  #   proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  #   proxy_set_header   X-Forwarded-Proto $scheme;
  #   proxy_read_timeout 30s;
  # }

  # -----------------------------------------------------------------------
  # oauth2-proxy IAP — subrequest auth endpoint (internal only)
  # nginx sends a subrequest here; oauth2-proxy validates session cookie and
  # returns 200 (authed) or 401 (not authed). Body is never forwarded.
  # -----------------------------------------------------------------------
  location = /oauth2/auth {
    internal;
    set $oauth2_upstream oauth2-proxy;
    proxy_pass              http://$oauth2_upstream:4180/oauth2/auth;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        X-Forwarded-Uri   $request_uri;
    # Do not forward request body to the auth subrequest
    proxy_pass_request_body off;
    proxy_set_header        Content-Length    "";
  }

  # -----------------------------------------------------------------------
  # oauth2-proxy public endpoints: /oauth2/callback, /oauth2/start,
  # /oauth2/sign_out, /oauth2/ping — NO auth_request here (bootstrap flow)
  # -----------------------------------------------------------------------
  location /oauth2/ {
    set $oauth2_upstream oauth2-proxy;
    proxy_pass         http://$oauth2_upstream:4180;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
  }

  # -----------------------------------------------------------------------
  # 401 → redirect to oauth2-proxy sign-in, preserving original URL
  # oauth2-proxy will then redirect to Zitadel authorize endpoint.
  # -----------------------------------------------------------------------
  error_page 401 = @error401;
  location @error401 {
    return 302 https://$host/oauth2/start?rd=$scheme://$host$request_uri;
  }

  # -----------------------------------------------------------------------
  # Backend API — auth_request protected
  # After successful auth, inject X-Onemcp-User from oauth2-proxy header
  # so backend identifies the user without code changes.
  # -----------------------------------------------------------------------
  location /api/ {
    # auth_request REMOVED — plan onelog 260819-1628 phase-03. Backend now handles
    # auth qua ZitadelJwtMiddleware (Bearer JWT từ portal) hoặc BearerAuthMiddleware
    # (opaque MCP token). TrustUserMiddleware fallback throw 400 nếu không có auth
    # header nào → sẽ hiện lỗi nếu client gọi không có Bearer. Portal api-client tự
    # forward Bearer từ NextAuth session.
    # Rollback: uncomment auth_request block trên + set AUTH_MODE=iap.
    set $backend_upstream backend;
    proxy_pass         http://$backend_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # -----------------------------------------------------------------------
  # NextAuth v5 handlers (portal, plan onelog 260819-1628 phase-03) — NO auth_request.
  # /api/auth/signin, /api/auth/callback/zitadel, /api/auth/session, /api/auth/signout,
  # /api/auth/csrf, /api/auth/providers must be reachable BEFORE user is authenticated.
  # Longer prefix `/api/auth/` wins over `/api/` in nginx location matching.
  # Proxy tới portal (NextAuth mount trong Next.js app), KHÔNG phải backend.
  # -----------------------------------------------------------------------
  location /api/auth/ {
    set $portal_upstream portal;
    proxy_pass         http://$portal_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Custom signin page auto-trigger OAuth (plan onelog 260819-1628 phase-03).
  # /auth/signin → Server Component gọi signIn() → NEXT_REDIRECT tới Zitadel.
  # Cần NO auth_request vì user chưa authenticated.
  location /auth/ {
    set $portal_upstream portal;
    proxy_pass         http://$portal_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # -----------------------------------------------------------------------
  # GitLab per-project webhook — NO auth_request. HMAC (X-Gitlab-Token) is
  # verified by ProjectHmacGuard in backend against project.webhookSecret.
  # Must be defined BEFORE `location /api/` in nginx match order... but nginx
  # uses longest-prefix match for prefix locations, so more-specific wins.
  # -----------------------------------------------------------------------
  location /api/webhooks/ {
    set $backend_upstream backend;
    proxy_pass         http://$backend_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # -----------------------------------------------------------------------
  # OAuth 2.1 AS discovery + protected resource metadata — public per RFC.
  # No auth_request. Bypass portal/api catch-all.
  # -----------------------------------------------------------------------
  location = /.well-known/oauth-authorization-server {
    set $backend_upstream backend;
    proxy_pass         http://$backend_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
  location = /.well-known/oauth-protected-resource {
    set $backend_upstream backend;
    proxy_pass         http://$backend_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # -----------------------------------------------------------------------
  # OAuth 2.1 AS public endpoints — DCR / token / revoke / client-info.
  # NO auth_request; backend TrustUserMiddleware also bypasses these paths.
  # -----------------------------------------------------------------------
  location /api/oauth/register {
    set $backend_upstream backend;
    proxy_pass http://$backend_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/oauth/token {
    set $backend_upstream backend;
    proxy_pass http://$backend_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/oauth/revoke {
    set $backend_upstream backend;
    proxy_pass http://$backend_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/oauth/client-info {
    set $backend_upstream backend;
    proxy_pass http://$backend_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # -----------------------------------------------------------------------
  # MCP SSE endpoint — NO auth_request (long-lived, uses Bearer token auth)
  # MCP clients authenticate via Authorization: Bearer header at backend layer.
  # Do NOT add auth_request here — it breaks SSE connection establishment.
  # -----------------------------------------------------------------------
  # Bare /mcp (no trailing slash) — redirect to /mcp/ so client discovery works.
  location = /mcp {
    return 302 /mcp/;
  }

  location /mcp/ {
    set $backend_upstream backend;
    # Backend has global prefix /api → rewrite /mcp/* to /api/mcp/*.
    rewrite ^/mcp/(.*)$ /api/mcp/$1 break;

    proxy_pass         http://$backend_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Onemcp-User     $http_x_onemcp_user;
    proxy_set_header   Connection        "";
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding on;
  }

  # -----------------------------------------------------------------------
  # Portal (Next.js) — NextAuth middleware handles auth (plan onelog 260819-1628 phase-03)
  # auth_request REMOVED — portal /middleware.ts check NextAuth session, redirect
  # /auth/signin nếu chưa auth. IAP path /oauth2/* vẫn giữ cho MCP OAuth AS clients
  # nhưng KHÔNG gate portal navigation nữa.
  # Rollback: uncomment `auth_request /oauth2/auth;` + set AUTH_MODE=iap.
  # -----------------------------------------------------------------------
  location / {
    set $portal_upstream portal;
    proxy_pass         http://$portal_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
  }
}
