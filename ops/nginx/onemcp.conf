# OneMCP nginx reverse proxy
# HTTPS termination + oauth2-proxy IAP auth_request sidecar
# Phase 3+4: Zitadel SSO via oauth2-proxy — /mcp/ remains unprotected (Bearer token auth)

# Docker embedded DNS — defer upstream resolution to request time so nginx
# doesn't crash if backend/portal/oauth2-proxy container not yet up at nginx boot.
resolver 127.0.0.11 valid=10s ipv6=off;

# Trust Docker network for X-Forwarded-For rewriting
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate limit zones (per IP + username claim)
limit_req_zone $binary_remote_addr zone=user_ip:10m rate=100r/s;
limit_req_zone "$binary_remote_addr$http_x_onemcp_user" zone=user_id:10m rate=200r/s;

# --- HTTP → HTTPS redirect ---
server {
  listen 80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

# --- HTTPS main ---
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/tls/onemcp.crt;
  ssl_certificate_key /etc/nginx/tls/onemcp.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Body size (attachments up to 100MB — enforced further at MinIO presign)
  client_max_body_size 100M;

  # Rate limits
  limit_req zone=user_ip burst=200 nodelay;
  limit_req zone=user_id burst=400 nodelay;

  # --- Alertmanager webhook IP allowlist (Phase 06, V4) ---
  # Only Alertmanager pod(s) should POST to this endpoint.
  # Replace 10.0.1.0/24 with your actual Alertmanager CIDR before enabling.
  # Uncomment the geo block in the http context and this location block to activate.
  #
  # In http context (outside server block), add:
  #   geo $alertmanager_allowed {
  #     default         0;
  #     10.0.1.10/32    1;  # alertmanager pod IP
  #     10.0.1.0/24     1;  # alertmanager pod CIDR
  #   }
  #
  # Then uncomment this location override:
  # location /api/webhooks/alertmanager {
  #   if ($alertmanager_allowed = 0) {
  #     return 403 "IP not allowed";
  #   }
  #   set $backend_upstream backend;
  #   proxy_pass         http://$backend_upstream:3000;
  #   proxy_http_version 1.1;
  #   proxy_set_header   Host              $host;
  #   proxy_set_header   X-Real-IP         $remote_addr;
  #   proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  #   proxy_set_header   X-Forwarded-Proto $scheme;
  #   proxy_read_timeout 30s;
  # }

  # -----------------------------------------------------------------------
  # oauth2-proxy IAP — subrequest auth endpoint (internal only)
  # nginx sends a subrequest here; oauth2-proxy validates session cookie and
  # returns 200 (authed) or 401 (not authed). Body is never forwarded.
  # -----------------------------------------------------------------------
  location = /oauth2/auth {
    internal;
    set $oauth2_upstream oauth2-proxy;
    proxy_pass              http://$oauth2_upstream:4180/oauth2/auth;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        X-Forwarded-Uri   $request_uri;
    # Do not forward request body to the auth subrequest
    proxy_pass_request_body off;
    proxy_set_header        Content-Length    "";
  }

  # -----------------------------------------------------------------------
  # oauth2-proxy public endpoints: /oauth2/callback, /oauth2/start,
  # /oauth2/sign_out, /oauth2/ping — NO auth_request here (bootstrap flow)
  # -----------------------------------------------------------------------
  location /oauth2/ {
    set $oauth2_upstream oauth2-proxy;
    proxy_pass         http://$oauth2_upstream:4180;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
  }

  # -----------------------------------------------------------------------
  # 401 → redirect to oauth2-proxy sign-in, preserving original URL
  # oauth2-proxy will then redirect to Zitadel authorize endpoint.
  # -----------------------------------------------------------------------
  error_page 401 = @error401;
  location @error401 {
    return 302 https://$host/oauth2/start?rd=$scheme://$host$request_uri;
  }

  # -----------------------------------------------------------------------
  # Backend API — auth_request protected
  # After successful auth, inject X-Onemcp-User from oauth2-proxy header
  # so backend identifies the user without code changes.
  # -----------------------------------------------------------------------
  location /api/ {
    auth_request /oauth2/auth;

    # Capture identity headers emitted by oauth2-proxy on successful auth
    auth_request_set $auth_email $upstream_http_x_auth_request_email;
    auth_request_set $auth_user  $upstream_http_x_auth_request_user;

    set $backend_upstream backend;
    proxy_pass         http://$backend_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Inject authenticated email as X-Onemcp-User — backend reads this header unchanged
    proxy_set_header   X-Onemcp-User     $auth_email;
    proxy_read_timeout 300s;
  }

  # -----------------------------------------------------------------------
  # MCP SSE endpoint — NO auth_request (long-lived, uses Bearer token auth)
  # MCP clients authenticate via Authorization: Bearer header at backend layer.
  # Do NOT add auth_request here — it breaks SSE connection establishment.
  # -----------------------------------------------------------------------
  location /mcp/ {
    set $backend_upstream backend;
    proxy_pass         http://$backend_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Onemcp-User     $http_x_onemcp_user;
    proxy_set_header   Connection        "";
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding on;
  }

  # -----------------------------------------------------------------------
  # Portal (Next.js) — auth_request protected
  # -----------------------------------------------------------------------
  location / {
    auth_request /oauth2/auth;

    # Capture identity headers emitted by oauth2-proxy on successful auth
    auth_request_set $auth_email $upstream_http_x_auth_request_email;
    auth_request_set $auth_user  $upstream_http_x_auth_request_user;

    set $portal_upstream portal;
    proxy_pass         http://$portal_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Inject authenticated user identity for SSR context if portal reads it
    proxy_set_header   X-Onemcp-User     $auth_email;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
  }
}
