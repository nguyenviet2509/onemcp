name: onemcp

services:
  postgres:
    # Official pgvector image bundles postgres 16 + pgvector extension.
    # Alpine variant không có pgvector — dùng debian bookworm.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onemcp}
      POSTGRES_USER: ${POSTGRES_USER:-onemcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onemcp} -d ${POSTGRES_DB:-onemcp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-512MB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE:-2GB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-8MB}"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-100}"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "1gb"
      - "--maxmemory-policy"
      - "noeviction"
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-onemcp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-min-8-chars}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Root context so workspace pnpm-lock.yaml + pnpm-workspace.yaml are accessible.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      tei:
        condition: service_healthy
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgres://${POSTGRES_USER:-onemcp}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-onemcp}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-onemcp}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-min-8-chars}
      MINIO_BUCKET: ${MINIO_BUCKET:-onemcp-artifacts}
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-100}
      USER_ALLOW_CIDR: ${USER_ALLOW_CIDR:-10.0.14.0/24}
      ADMIN_ALLOW_CIDR: ${ADMIN_ALLOW_CIDR:-192.168.122.0/24}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
      TRUST_USER_HEADER: ${TRUST_USER_HEADER:-X-Onemcp-User}
      DEFAULT_ROLE: ${DEFAULT_ROLE:-contributor}
      MAINTAINER_USERNAMES: ${MAINTAINER_USERNAMES:-}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      EMERGENCY_LOCKDOWN: ${EMERGENCY_LOCKDOWN:-false}
      GIT_MIRROR_ROOT: /var/lib/onemcp/mirrors
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      GITLAB_MIRROR_TOKEN: ${GITLAB_MIRROR_TOKEN:-}
      # Phase 2: OAuth-driven project auto-provision (creates GitLab webhook + deploy token).
      GITLAB_SSO_BASE_URL: ${GITLAB_SSO_BASE_URL:-https://gitlabs.inet.vn}
      GITLAB_OAUTH_APP_ID: ${GITLAB_OAUTH_APP_ID:-}
      GITLAB_OAUTH_APP_SECRET: ${GITLAB_OAUTH_APP_SECRET:-}
      GITLAB_OAUTH_PROJECT_REDIRECT_URI: ${GITLAB_OAUTH_PROJECT_REDIRECT_URI:-https://oneconnector.000nethost.com/api/projects/oauth/callback}
      WEBHOOK_PUBLIC_BASE_URL: ${WEBHOOK_PUBLIC_BASE_URL:-https://oneconnector.000nethost.com}
      SKILLS_MONO_REPO: ${SKILLS_MONO_REPO:-onemcp/skills-kythuat}
      SKILLS_MONO_BRANCH: ${SKILLS_MONO_BRANCH:-main}
      SKILL_SYNC_CRON: ${SKILL_SYNC_CRON:-*/15 * * * *}
      SKILL_APPROVE_RATE_LIMIT: ${SKILL_APPROVE_RATE_LIMIT:-20}
      # Phase 7 ops incident response
      ONEMCP_ENABLE_OPS_TYPES: ${ONEMCP_ENABLE_OPS_TYPES:-0}
      ONEMCP_KNOWN_SERVICES: ${ONEMCP_KNOWN_SERVICES:-postgres,redis,nginx,minio,backend,portal,gitlab}
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:-}
      SLACK_ONCALL_WEBHOOK_URL: ${SLACK_ONCALL_WEBHOOK_URL:-}
      RUNBOOK_EVENTS_RETAIN_DAYS: ${RUNBOOK_EVENTS_RETAIN_DAYS:-90}
      ALERTMANAGER_SYSTEM_USER: ${ALERTMANAGER_SYSTEM_USER:-system-alertmanager}
      ALERTMANAGER_DEDUP_TTL_MIN: ${ALERTMANAGER_DEDUP_TTL_MIN:-240}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
      # Phase 2B: TEI embedding service — internal docker network, not exposed to host.
      EMBEDDING_URL: ${EMBEDDING_URL:-http://tei:80}
      # AI Connector Hub (parent P2): AES-256 encryption key + OAuth 2.1 AS config.
      ONEMCP_ENCRYPTION_KEY: ${ONEMCP_ENCRYPTION_KEY}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-https://oneconnector.000nethost.com}
      OAUTH_RESOURCE_URL: ${OAUTH_RESOURCE_URL:-https://oneconnector.000nethost.com/api/mcp}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://oneconnector.000nethost.com}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-off}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-jsonrpc}
      # Zitadel OIDC user auth (plan onelog 260819-1628 phase-03) — dual-mode.
      # ENABLED=false → ZitadelJwtMiddleware skip, IAP path only.
      # ENABLED=true → verify Bearer JWT từ portal, extract roles claim.
      ZITADEL_OIDC_ENABLED: ${ZITADEL_OIDC_ENABLED:-false}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-http://10.200.0.125}
      ZITADEL_JWKS_URI: ${ZITADEL_JWKS_URI:-http://10.200.0.125/oauth/v2/keys}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:-}
    volumes:
      - git-mirrors:/var/lib/onemcp/mirrors
    ports:
      - "127.0.0.1:3000:3000"
      # Private-net binding — OneLog vmagent scrapes /metrics via 10.200.0.44:3000
      # (plan 260821-1346 onemcp-monitor-backup-integration).
      - "10.200.0.44:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEM_LIMIT:-2g}
          cpus: '${BACKEND_CPU_LIMIT:-2}'

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* must be baked at build time (Next.js reads them at build).
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-iap}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      # Next 15 standalone binds to $HOSTNAME; force 0.0.0.0 so container
      # loopback healthcheck succeeds (otherwise binds to container IP only).
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost/api}
      # Zitadel OIDC (plan onelog 260819-1628 phase-03) — NextAuth v5 config.
      # AUTH_MODE=iap (default) → NextAuth handlers mount nhưng middleware skip.
      # AUTH_MODE=oidc → middleware bảo vệ routes, api-client forward Bearer.
      AUTH_MODE: ${AUTH_MODE:-iap}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TRUST_HOST: 'true'
      # AUTH_URL bắt buộc set explicit vì HOSTNAME=0.0.0.0 (Node bind) làm NextAuth
      # v5 internal URL construction dùng 0.0.0.0:3000 → callback wrong → redirect loop.
      # Set = public URL, NextAuth build absolute callback đúng.
      AUTH_URL: ${AUTH_URL:-https://oneconnector.000nethost.com}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-http://10.200.0.125}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:-}
      ZITADEL_CLIENT_SECRET: ${ZITADEL_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  backup:
    build:
      context: ./ops/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-onemcp}
      POSTGRES_USER: ${POSTGRES_USER:-onemcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-onemcp}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-min-8-chars}
      MINIO_BUCKET: ${MINIO_BUCKET:-onemcp-artifacts}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-14}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
    volumes:
      - ./backups:/backups

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    restart: unless-stopped
    command:
      - "--model-id"
      - "intfloat/multilingual-e5-small"
      - "--max-batch-tokens"
      - "8192"
      - "--max-client-batch-size"
      - "8"
      - "--auto-truncate"
    volumes:
      - tei-cache:/data
    # Internal-only: backend hits http://tei:80/embed. Not exposed to host.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: onemcp-oauth2-proxy-1
    restart: unless-stopped
    command: --config=/etc/oauth2-proxy.cfg
    volumes:
      - ./ops/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro
    # Not exposed to host — nginx reaches it via docker network on port 4180
    # oauth2-proxy image is distroless (no shell/wget/curl available inside container).
    # Healthcheck disabled — nginx upstream handles unavailability gracefully on connect fail.
    # To check manually: docker exec onemcp-nginx-1 wget -qO- http://oauth2-proxy:4180/ping
    healthcheck:
      disable: true

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - portal
      - oauth2-proxy
    volumes:
      - ./ops/nginx/onemcp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/nginx/tls:/etc/nginx/tls:ro
      # Let's Encrypt: certbot writes /etc/letsencrypt (certs) + /var/www/certbot (challenge).
      # Nginx reads both. See ops/certbot/README.md for issuance.
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"

  # Certbot — on-demand cert issue + renewal. Not restarted; run manually via
  # `docker compose run --rm certbot ...`. See ops/certbot/README.md.
  certbot:
    image: certbot/certbot:latest
    profiles: ["cert"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["certbot"]

  # ─── Observability sidecars (plan 260821-1346-onemcp-monitor-backup) ───
  # Scraped by onelog-vps vmagent (10.200.0.30) over private net.
  # All exporter ports bound to 10.200.0.44 only — never public.

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    ports:
      - "10.200.0.44:9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "10.200.0.44:8081:8080"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgres://${POSTGRES_USER:-onemcp}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-onemcp}?sslmode=disable
    ports:
      - "10.200.0.44:9187:9187"

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    depends_on:
      - redis
    command:
      - "--redis.addr=redis://redis:6379"
    ports:
      - "10.200.0.44:9121:9121"

  vector:
    image: timberio/vector:0.42.0-alpine
    restart: unless-stopped
    user: "0:0"    # root — read /var/log/{syslog,auth.log} (mode 640 syslog:adm)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ops/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/log:/var/log:ro
    command: ["--config", "/etc/vector/vector.yaml"]

volumes:
  pg-data:
  redis-data:
  minio-data:
  git-mirrors:
  tei-cache:
  certbot-etc:
  certbot-www:
